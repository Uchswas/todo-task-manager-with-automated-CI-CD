name: Auto Release with Changelog

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Compute next version (patch bump)
        id: version
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          if [ -z "$LAST" ]; then
            # no previous tag: start at release-0.0.0
            NEW="release-0.0.0"
          else
            # assume tag format release-X.Y.Z
            VER="${LAST#release-}"
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            PAT=$((PAT+1))
            NEW="release-$MAJ.$MIN.$PAT"
          fi
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEW"

      - name: Generate changelog
        id: changelog
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          NEW="${{ steps.version.outputs.new_tag }}"

          {
            echo "# Changelog for $NEW"
            echo

            if [ -z "$LAST" ]; then
              echo "Initial release."
              echo
              git log --oneline
            else
              echo "Changes since $LAST:"
              echo
              git log "$LAST"..HEAD --oneline
            fi
          } > changelog.md

          echo "Generated changelog:"
          cat changelog.md

      - name: Create GitHub Release with tag and changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          COMMIT_SHA="${{ github.sha }}"

          # Escape changelog as JSON-safe string
          CHANGELOG_JSON=$(python3 -c "import json, sys; print(json.dumps(sys.stdin.read()))" < changelog.md)

          API_URL="https://api.github.com/repos/${{ github.repository }}/releases"

          echo "Creating release $TAG for commit $COMMIT_SHA via $API_URL"

          # Call GitHub Releases API
          HTTP_STATUS=$(curl -sSL -w "%{http_code}" -o /tmp/release.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"target_commitish\": \"$COMMIT_SHA\",
              \"name\": \"$TAG\",
              \"body\": $CHANGELOG_JSON
            }")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Release created successfully:"
            cat /tmp/release.json
          else
            echo "Failed to create release. HTTP status: $HTTP_STATUS"
            cat /tmp/release.json
            exit 1
          fi
