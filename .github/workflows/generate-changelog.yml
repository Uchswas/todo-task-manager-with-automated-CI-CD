name: Auto Release with Changelog

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write    
  
jobs:
  release:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}   

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Compute next version (patch bump)
        id: version
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          if [ -z "$LAST" ]; then
            # no previous tag: start at release-0.0.0
            NEW="release-0.0.0"
          else
            # assume tag format release-X.Y.Z
            VER="${LAST#release-}"
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            PAT=$((PAT+1))
            NEW="release-$MAJ.$MIN.$PAT"
          fi
          echo "new_tag=$NEW" >> $GITHUB_OUTPUT
          echo "Next tag: $NEW"

      - name: Generate changelog
        id: changelog
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          NEW="${{ steps.version.outputs.new_tag }}"
          echo "# Changelog for $NEW" > changelog.md
          echo >> changelog.md

          if [ -z "$LAST" ]; then
            echo "Initial release." >> changelog.md
            echo >> changelog.md
            git log --oneline >> changelog.md
          else
            echo "Changes since $LAST:" >> changelog.md
            echo >> changelog.md
            git log "$LAST"..HEAD --oneline >> changelog.md
          fi

          echo "Generated changelog:"
          cat changelog.md

      - name: Create GitHub Release with tag and changelog
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "Error: GIT_TOKEN secret is not set. Please add your Personal Access Token (PAT) as a secret named GIT_TOKEN."
            exit 1
          fi
          
          TAG="${{ steps.version.outputs.new_tag }}"
          COMMIT_SHA="${{ github.sha }}"
          
          # Escape JSON using Python
          CHANGELOG_JSON=$(python3 -c "import json, sys; print(json.dumps(sys.stdin.read()))" < changelog.md)
          
          # Create release via GitHub API (tag will be created automatically)
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${GIT_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{
              \"tag_name\": \"$TAG\",
              \"target_commitish\": \"$COMMIT_SHA\",
              \"name\": \"$TAG\",
              \"body\": $CHANGELOG_JSON
            }"
          
