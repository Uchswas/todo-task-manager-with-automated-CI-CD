name: Auto Release with Changelog

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Show GitHub env (debug)
        run: |
          echo "GITHUB_SERVER_URL=$GITHUB_SERVER_URL"
          echo "GITHUB_API_URL=$GITHUB_API_URL"

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Compute next version (patch bump)
        id: version
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          if [ -z "$LAST" ]; then
            # no previous tag: start at release-0.0.0
            NEW="release-0.0.0"
          else
            # assume tag format release-X.Y.Z
            VER="${LAST#release-}"
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            PAT=$((PAT+1))
            NEW="release-$MAJ.$MIN.$PAT"
          fi
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEW"

      - name: Generate changelog
        run: |
          LAST="${{ steps.last_tag.outputs.last_tag }}"
          NEW="${{ steps.version.outputs.new_tag }}"

          {
            echo "# Changelog for $NEW"
            echo

            if [ -z "$LAST" ]; then
              echo "Initial release."
              echo
              git log --oneline
            else
              echo "Changes since $LAST:"
              echo
              git log "$LAST"..HEAD --oneline
            fi
          } > changelog.md

          echo "Generated changelog:"
          cat changelog.md

      - name: Test GitHub API with GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Calling $GITHUB_API_URL/user"
          curl -sS -w "\nHTTP status: %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/user"

      - name: Create GitHub Release with tag and changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          COMMIT_SHA="${{ github.sha }}"

          # Escape changelog into a JSON-safe string
          CHANGELOG_JSON=$(python3 -c "import json, sys; print(json.dumps(sys.stdin.read()))" < changelog.md)

          # Use the Enterprise API URL from the environment
          API_URL="$GITHUB_API_URL/repos/${{ github.repository }}/releases"

          echo "Creating release $TAG for commit $COMMIT_SHA via $API_URL"

          HTTP_STATUS=$(curl -sSL -w "%{http_code}" -o /tmp/release.json \
            --request POST \
            --url "$API_URL" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data "{
              \"tag_name\": \"$TAG\",
              \"target_commitish\": \"$COMMIT_SHA\",
              \"name\": \"$TAG\",
              \"body\": $CHANGELOG_JSON
            }")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/release.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Failed to create release"
            exit 1
          fi
