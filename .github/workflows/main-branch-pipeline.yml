name: Main Branch Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  python-lint:
    uses: ./.github/workflows/python-lint.yaml

  eslint:
    uses: ./.github/workflows/es-lint.yaml

  test-backend-unit:
    uses: ./.github/workflows/backend-unit-tests.yml
    secrets: inherit

  test-frontend-unit:
    uses: ./.github/workflows/frontend-unit-tests.yml

  test-backend-integration:
    needs: [python-lint, eslint, test-backend-unit, test-frontend-unit]
    uses: ./.github/workflows/backend-integration-tests.yml
    secrets: inherit

  test-frontend-integration:
    needs: [python-lint, eslint, test-backend-unit, test-frontend-unit]
    uses: ./.github/workflows/frontend-integration-tests.yml

  test-e2e:
    needs: [python-lint, eslint, test-backend-unit, test-frontend-unit, test-backend-integration, test-frontend-integration]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  deploy:
    needs: [python-lint, eslint, test-backend-unit, test-frontend-unit, test-backend-integration, test-frontend-integration, test-e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/production-deploy.yml
    secrets: inherit
    with:
      branch: main

