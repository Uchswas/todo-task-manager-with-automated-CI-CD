name: Main Branch Pipeline

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  python-lint:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    uses: ./.github/workflows/python-lint.yaml

  eslint:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    uses: ./.github/workflows/es-lint.yaml

  test-backend-unit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    uses: ./.github/workflows/backend-unit-tests.yml
    secrets: inherit

  test-frontend-unit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize'))
    uses: ./.github/workflows/frontend-unit-tests.yml

  test-backend-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [python-lint, test-backend-unit]
    uses: ./.github/workflows/backend-integration-tests.yml
    secrets: inherit

 test-frontend-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [eslint, test-frontend-unit]
    uses: ./.github/workflows/frontend-integration-tests.yml

  test-e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [test-backend-integration, test-frontend-integration]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  deploy:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/production-deploy.yml
    secrets: inherit
    with:
      branch: main

