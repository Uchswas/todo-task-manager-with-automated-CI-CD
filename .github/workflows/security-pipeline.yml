name: Security Pipeline

on:
  push:
    branches-ignore:
      - main
      - dev
      - release

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip install -r task-manager/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Snyk CLI (local)
        run: npm install snyk@1.1290.0 --prefix .snyk-cli
      
      - name: Run Snyk for Python Dependencies
        run: ./.snyk-cli/node_modules/.bin/snyk test --severity-threshold=high --file=requirements.txt --package-manager=pip
        working-directory: task-manager/backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true 
      
      - name: Install Node dependencies
        working-directory: task-manager/frontend
        run: npm install
      
      - name: Run Snyk for JavaScript Dependencies
        run: ./.snyk-cli/node_modules/.bin/snyk test --severity-threshold=high --file=package.json --package-manager=npm
        working-directory: task-manager/frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Install Trivy CLI
        run: |
          TRIVY_VERSION=0.53.0
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
          trivy --version

      - name: Run Trivy FS Scan on Backend
        run: |
          trivy fs --format table --severity CRITICAL,HIGH --exit-code 0 task-manager/backend
          trivy fs --format sarif --output trivy-backend-results.sarif --severity CRITICAL,HIGH task-manager/backend

      - name: Run Trivy FS Scan on Frontend
        run: |
          trivy fs --format table --severity CRITICAL,HIGH --exit-code 0 task-manager/frontend
          trivy fs --format sarif --output trivy-frontend-results.sarif --severity CRITICAL,HIGH task-manager/frontend

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Upload Frontend Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
