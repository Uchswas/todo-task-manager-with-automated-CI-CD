name: Security Pipeline

on:
  push:
    branches-ignore:
      - main
      - dev
      - release

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          pip install -r task-manager/backend/requirements.txt
      
      - name: Run Snyk for Python Dependencies
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=task-manager/backend/requirements.txt
        continue-on-error: true 

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Node dependencies
        working-directory: task-manager/frontend
        run: npm install
      
      - name: Run Snyk for JavaScript Dependencies
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=task-manager/frontend/package.json
        continue-on-error: true

      - name: Build Backend Docker Image
        working-directory: task-manager/backend
        run: |
          docker build -t task-manager-backend:${{ github.sha }} .
      
      - name: Run Trivy Scan on Backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'task-manager-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Build Frontend Docker Image
        working-directory: task-manager/frontend
        run: |
          docker build -t task-manager-frontend:${{ github.sha }} .
      
      - name: Run Trivy Scan on Frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'task-manager-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Generate Trivy Report (Backend)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'task-manager-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy Report (Frontend)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'task-manager-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Upload Frontend Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
