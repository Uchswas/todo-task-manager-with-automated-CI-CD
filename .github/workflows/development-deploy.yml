name: Deploy to Development

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to Development Server
    runs-on: [self-hosted, Linux, X64]
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write SSH private key, preserving newlines
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Check if key file is empty
          if [ ! -s ~/.ssh/id_rsa ]; then
            echo "Error: SSH private key is EMPTY - SSH_PRIVATE_KEY secret is not set or is empty"
            exit 1
          fi
          
          # Check if key file is too small (likely empty or truncated)
          if [ $(wc -c < ~/.ssh/id_rsa) -lt 100 ]; then
            echo "Error: SSH private key is too small (likely EMPTY or truncated)"
            exit 1
          fi
          
          # Verify key format
          if ! ssh-keygen -l -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "Error: SSH private key is INVALID - key format is incorrect"
            echo "Key should start with: -----BEGIN OPENSSH PRIVATE KEY----- or -----BEGIN RSA PRIVATE KEY-----"
            exit 1
          fi
          
          # Add server to known_hosts
          ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key validated successfully"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create host.yaml file
        run: |
          cat > ansible/host.yaml << EOF
          [development]
          ${{ vars.SSH_HOST }} ansible_user=${{ vars.SSH_USER }} ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Create .env file
        run: |
          cat > ansible/.env << EOF
          # Database Configuration
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_TEST_DB=${{ secrets.POSTGRES_TEST_DB }}
          POSTGRES_TEST_USER=${{ secrets.POSTGRES_TEST_USER }}
          POSTGRES_TEST_PASSWORD=${{ secrets.POSTGRES_TEST_PASSWORD }}

          # Security Secrets
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}

          # Flask Configuration
          FLASK_ENV=${{ vars.FLASK_ENV }}
          FLASK_APP=${{ vars.FLASK_APP }}
          SQLALCHEMY_ECHO=${{ vars.SQLALCHEMY_ECHO }}
          TASKS_PER_PAGE=${{ vars.TASKS_PER_PAGE }}

          # CORS Configuration
          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}

          # Frontend Configuration
          REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}
          EOF

      - name: Deploy with Ansible
        run: |
          cd ansible
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i host.yaml deploy.yml --limit development --private-key ~/.ssh/id_rsa

