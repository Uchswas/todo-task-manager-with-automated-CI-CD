name: Backend Integration Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    environment: development
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start PostgreSQL container
      env:
        POSTGRES_TEST_DB: ${{ secrets.POSTGRES_TEST_DB }}
        POSTGRES_TEST_USER: ${{ secrets.POSTGRES_TEST_USER }}
        POSTGRES_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
      run: |
        docker run -d \
          --name test-postgres \
          -e POSTGRES_DB=${POSTGRES_TEST_DB} \
          -e POSTGRES_USER=${POSTGRES_TEST_USER} \
          -e POSTGRES_PASSWORD=${POSTGRES_TEST_PASSWORD} \
          -p 5432:5432 \
          postgres:15
        sleep 5

    - name: Install PostgreSQL development libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Create virtual environment
      working-directory: task-manager/backend
      run: |
        python -m venv venv

    - name: Activate virtual environment and install dependencies
      working-directory: task-manager/backend
      run: |
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run integration tests
      working-directory: task-manager/backend
      env:
        POSTGRES_TEST_DB: ${{ secrets.POSTGRES_TEST_DB }}
        POSTGRES_TEST_USER: ${{ secrets.POSTGRES_TEST_USER }}
        POSTGRES_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        TEST_DATABASE_URL: postgresql://${{ secrets.POSTGRES_TEST_USER }}:${{ secrets.POSTGRES_TEST_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_TEST_DB }}
        JWT_SECRET: integration-tests-secret
        SECRET_KEY: integration-tests-secret
      run: |
        source venv/bin/activate
        pytest tests/integration -v

    - name: Clean up PostgreSQL container
      if: always()
      run: |
        docker stop test-postgres || true
        docker rm test-postgres || true

