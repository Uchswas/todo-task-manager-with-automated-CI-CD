name: ESLint Check
on:
  workflow_call:

jobs:
  eslint:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: task-manager/frontend
      run: |
        npm install

    - name: Run ESLint
      working-directory: task-manager/frontend
      run: |
        npx eslint . --ext .js,.jsx,.ts,.tsx
