name: ESLint Check
on: [push, pull_request]

jobs:
  eslint:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: task-manager/frontend
      run: |
        npm install

    - name: Run ESLint
      working-directory: task-manager/frontend
      run: |
        npx eslint . --ext .js,.jsx,.ts,.tsx
