services:
  db:
    image: postgres:15
    container_name: todo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-setup:
    image: postgres:15              
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app                     
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
    command: ["bash", "./scripts/setup-database.sh", "dev"]

  db-setup-test:
    image: postgres:15              
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - .:/app                     
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      DB_USER: ${POSTGRES_TEST_USER}
      DB_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      DB_HOST: db
    command: ["bash", "./scripts/setup-database.sh", "test"]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      db-setup-test:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_TEST_USER}:${POSTGRES_TEST_PASSWORD}@db:5432/${POSTGRES_TEST_DB}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_APP: ${FLASK_APP}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO}
      TASKS_PER_PAGE: ${TASKS_PER_PAGE}
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    ports:
      - "3000:3000"
